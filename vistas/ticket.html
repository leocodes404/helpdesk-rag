<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Ticket</title>
        <link rel="stylesheet" href="../estilos.css">
    </head>
    <body class="pagina-publica">
        <main class="contenedor-publico">
            <div class="encabezado-publico">
                <span class="marca-google">HelpDesk RAG</span>
                <h1>Registro de Ticket</h1>
                <p>Describe tu incidencia y nuestro equipo te ayudará.</p>
            </div>
            <form action="/procesar" method="POST" enctype="multipart/form-data" class="form-publico formulario-ticket" onsubmit="event.preventDefault(); alert('Ticket registrado correctamente.');">
                <div class="grupo-input">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="grupo-input">
                    <label for="servicio">Servicio afectado</label>
                    <select id="servicio" name="servicio" required>
                        <option value="" disabled selected>Seleccione un servicio</option>
                        <option value="equipos">Equipos informáticos</option>
                        <option value="Software">Software</option>
                        <option value="redes">Redes</option>
                        <option value="cuentas">Cuentas de usuario</option>
                        <option value="sisinstitucionales">Sistemas institucionales</option>
                        <option value="impresoras">Impresoras</option>
                        <option value="conectividad">Conectividad</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" maxlength="500" required></textarea>
                </div>
                <div class="grupo-input">
                    <label for="archivo">Adjuntar archivo <span>(opcional)</span></label>
                    <input type="file" id="archivo" name="archivo" accept=".jpg,.jpeg,.png,.pdf,.docx,.xlsx">
                </div>
                <button type="submit" class="btn-google">Enviar ticket</button>
            </form>
            <nav class="enlaces-publicos">
                <a href="seguimiento.html">Consultar estado de mi ticket</a>
                <a href="login.html">Acceso personal TI</a>
            </nav>
        </main>
    </body>
</html>
